  /* ================= undo / redo ================= */
  let undoStack=[], redoStack=[];
  const snapshot = () => JSON.stringify(state.entries);
  const shorten = t => (t||"").length>26 ? t.slice(0,26)+"…" : (t||"an entry");
  function pushUndoFrom(snap,label){
    undoStack.push({s:snap,label});
    if(undoStack.length>20) undoStack.shift();
    redoStack.length=0; renderUndoBtn();
  }
  const pushUndo = label => pushUndoFrom(snapshot(),label);
  function applyHistory(from,to,verb){
    if(!from.length) return;
    const top=from.pop();
    to.push({s:snapshot(),label:top.label});
    try{ state.entries=JSON.parse(top.s); }catch(e){ return; }
    state.editingId=null; state.numEditing=null; lastNums={};
    save(); render(); renderUndoBtn();
    toast(verb+" "+top.label,null);
  }
  const undo = () => applyHistory(undoStack,redoStack,"Undid");
  const redo = () => applyHistory(redoStack,undoStack,"Redid");
  function renderUndoBtn(){
    const b=$("undoBtn"); if(!b) return;
    b.hidden = !undoStack.length;
    if(undoStack.length) b.title="Undo "+undoStack[undoStack.length-1].label;
  }

  /* ================= text matching ================= */
  const norm = s => String(s||"").toLowerCase().replace(/[^\p{L}\p{N} ]+/gu," ").replace(/\s+/g," ").trim();
  function trigrams(s){
    const p="  "+s+" ", out=new Set();
    for(let i=0;i<p.length-2;i++) out.add(p.slice(i,i+3));
    return out;
  }
  function dice(a,b){
    const A=trigrams(a), B=trigrams(b);
    if(!A.size||!B.size) return 0;
    let hits=0; A.forEach(t=>{ if(B.has(t)) hits++; });
    return 2*hits/(A.size+B.size);
  }
  function subseq(text,q){
    let i=0, score=0, streak=0;
    for(const ch of text){
      if(i<q.length && ch===q[i]){ i++; streak++; score+=streak; }
      else streak=0;
    }
    return i===q.length ? Math.min(1, score/(q.length*q.length)) : 0;
  }
  /* tolerant search: exact, then in-order letters, then typo-tolerant trigrams */
  function matchScore(entry,rawQ){
    const q=norm(rawQ); if(!q) return 1;
    const t=norm(entry.text), tags=(entry.tags||[]).join(" ");
    if(t.includes(q)) return 2 + (t.startsWith(q)?0.5:0);
    if(tags.includes(q)) return 1.9;
    let word=0; t.split(" ").forEach(w=>{ word=Math.max(word,dice(w,q)); });
    (entry.tags||[]).forEach(w=>{ word=Math.max(word,dice(w,q)); });
    const score=Math.max(subseq(t,q)*0.7, dice(t,q), word*0.95);
    return score>=0.36 ? score : 0;
  }
  /* near-duplicate check on add */
  function findSimilar(text){
    const a=norm(text); if(a.length<4) return null;
    let best=null;
    state.entries.forEach((e,i)=>{
      if(!e.text) return;
      const b=norm(e.text);
      let s=dice(a,b);
      if(a===b) s=1;
      else if(a.includes(b)||b.includes(a)) s=Math.max(s,0.85);
      if(s>=0.72 && (!best||s>best.s)) best={s,entry:e,rank:i+1};
    });
    return best;
  }

  /* ================= comparison placement ================= */
  let duel=null;
  function duelsPossible(){ return state.duels && state.entries.length>0; }

  function startDuel(entry, onCancel){
    const n=state.entries.length;
    if(!n){ finishDuel(entry,0); return; }
    duel={ entry, lo:0, hi:n, step:0,
           total:Math.max(1,Math.ceil(Math.log2(n+1))), history:[], onCancel };
    renderDuel();
  }
  function duelPick(newIsBetter){
    if(!duel) return;
    const mid=Math.floor((duel.lo+duel.hi)/2);
    duel.history.push({lo:duel.lo,hi:duel.hi});
    if(newIsBetter) duel.hi=mid; else duel.lo=mid+1;
    duel.step++; buzz(8);
    if(duel.lo>=duel.hi) finishDuel(duel.entry,duel.lo); else renderDuel();
  }
  function duelTie(){
    if(!duel) return;
    const mid=Math.floor((duel.lo+duel.hi)/2);
    finishDuel(duel.entry, Math.min(state.entries.length, mid+1));
  }
  function duelBack(){
    if(!duel||!duel.history.length) return;
    const h=duel.history.pop();
    duel.lo=h.lo; duel.hi=h.hi; duel.step=Math.max(0,duel.step-1);
    renderDuel();
  }
  function duelCancel(){
    if(!duel) return;
    const cb=duel.onCancel, e=duel.entry;
    duel=null; $("duel").hidden=true;
    if(cb) cb(e); else finishPlacement(e, state.entries.length);
  }
  function finishDuel(entry,index){
    duel=null; $("duel").hidden=true;
    finishPlacement(entry,index);
  }
  function finishPlacement(entry,index){
    const i=Math.max(0,Math.min(state.entries.length,index));
    pushUndo("placing “"+shorten(entry.text)+"”");
    state.entries.splice(i,0,entry);
    justAdded=entry.id; jumpTo=i+1;
    save(); render();
    toast("Placed at rank "+(i+1), null);
  }

  function renderDuel(){
    const p=$("duel"); p.textContent="";
    const mid=Math.floor((duel.lo+duel.hi)/2);
    const rival=state.entries[mid];
    if(!rival){ finishDuel(duel.entry,duel.lo); return; }

    const head=el("div","duelhead");
    head.append(el("h2",null,"Which is better?"));
    const bar=el("div","duelbar"); const fill=document.createElement("i");
    fill.style.width=Math.round(Math.min(1,duel.step/duel.total)*100)+"%";
    bar.append(fill); head.append(bar);
    head.append(el("div","duelstep","Comparison "+(duel.step+1)+" of about "+duel.total+
      " · narrowing to ranks "+(duel.lo+1)+"–"+Math.max(duel.lo+1,duel.hi)));
    p.append(head);

    const card=(e,fresh,label)=>{
      const b=el("button","duelcard"+(fresh?" fresh":""));
      b.append(el("div","who",label));
      b.append(el("div","what",e.text||"(untitled)"));
      if((e.tags||[]).length){
        const tg=el("div","tg");
        e.tags.forEach(t=>{
          const s=el("span","tag"); const d=el("span","dot"); d.style.background=tagColor(t);
          s.append(d, el("span",null,t)); tg.append(s);
        });
        b.append(tg);
      }
      b.onclick=()=>duelPick(fresh);
      return b;
    };
    const fresh=card(duel.entry,true,"The new one");
    const held=card(rival,false,"Currently ranked "+(mid+1));

    const cards=el("div","duelcards");
    // alternate which sits on top so position can't bias the choice
    if((duel.step+ (duel.entry.id||0))%2===0) cards.append(fresh, el("div","duelvs","or"), held);
    else cards.append(held, el("div","duelvs","or"), fresh);
    p.append(cards);

    const foot=el("div","duelfoot");
    const tie=el("button","btn","Too close to call"); tie.onclick=duelTie;
    foot.append(tie);
    if(duel.history.length){ const back=el("button","btn","Back"); back.onclick=duelBack; foot.append(back); }
    const skip=el("button","btn","Skip, put it last"); skip.onclick=duelCancel;
    foot.append(skip);
    p.append(foot);

    p.hidden=false;
  }

  /* ================= tiers on a normal curve ================= */
  const TIERS=[
    {k:"S",p:0.0228,c:"#FF5A5A"},
    {k:"A",p:0.1359,c:"#FF9F45"},
    {k:"B",p:0.3413,c:"#F5D547"},
    {k:"C",p:0.3413,c:"#7ED17E"},
    {k:"D",p:0.1359,c:"#6FA8DC"},
    {k:"F",p:0.0228,c:"#B0A8C0"}
  ];
  function tierSplit(n){
    if(n<=0) return TIERS.map(()=>0);
    const raw=TIERS.map(t=>t.p*n);
    const counts=raw.map(v=>Math.floor(v));
    let left=n-counts.reduce((a,b)=>a+b,0);
    const byFrac=raw.map((v,i)=>({i,f:v-Math.floor(v)})).sort((a,b)=>b.f-a.f);
    for(let j=0;j<left;j++) counts[byFrac[j%byFrac.length].i]++;
    // with a short list the tails round to nothing — lend them one each
    if(n>=TIERS.length){
      for(let i=0;i<counts.length;i++){
        if(counts[i]===0){
          let big=0;
          for(let j=0;j<counts.length;j++) if(counts[j]>counts[big]) big=j;
          if(counts[big]>1){ counts[big]--; counts[i]++; }
        }
      }
    }
    return counts;
  }
  function tierBands(){
    const rows=state.entries.filter(e=>e.text);
    const counts=tierSplit(rows.length);
    let at=0;
    return TIERS.map((t,i)=>{
      const items=rows.slice(at,at+counts[i]).map((e,j)=>({n:at+j+1,e}));
      at+=counts[i];
      return {t,items};
    });
  }
  const tiersAsText = () => listName()+" · tiers\n\n"+tierBands().map(b=>
      b.t.k+" ("+b.items.length+")\n"+(b.items.length? b.items.map(x=>"  "+x.n+". "+x.e.text).join("\n") : "  —")
    ).join("\n\n");

  function openTiers(){
    const p=$("panel"); p.textContent="";
    const bands=tierBands();
    const total=state.entries.filter(e=>e.text).length;

    const head=el("div","phead");
    head.append(el("h2",null,"Tiers"));
    const x=el("button","icon-btn","✕"); x.onclick=closeSheet; head.append(x);
    p.append(head);
    p.append(el("div","sub","Your ranking cut on a normal curve — 2.3, 13.6, 34.1, 34.1, 13.6, 2.3 per cent."+
      (total&&total<40?" Short lists get one entry per tier so none sit empty.":"")));

    const wrap=el("div"); wrap.style.marginTop="18px";
    bands.forEach(b=>{
      const band=el("div","tierband");
      const key=el("div","tierkey"); key.style.background=b.t.c;
      key.append(el("b",null,b.t.k), el("span",null,String(b.items.length)));
      band.append(key);
      const items=el("div","tieritems");
      if(!b.items.length) items.append(el("div","tierempty","empty"));
      b.items.forEach(it=>{
        const r=el("div","tieritem");
        const i=document.createElement("i"); i.textContent=it.n;
        r.append(i, el("span",null,it.e.text));
        items.append(r);
      });
      band.append(items);
      wrap.append(band);
    });
    p.append(wrap);

    p.append(el("h3",null,"Take it with you"));
    const row=el("div"); row.style.cssText="display:flex;flex-wrap:wrap;gap:8px";
    const a=el("button","btn primary","Download image"); a.onclick=downloadTierImage;
    const b2=el("button","btn","Copy as text"); b2.onclick=()=>copy(tiersAsText(),"Tiers copied");
    row.append(a,b2); p.append(row);

    p.hidden=false; $("scrim").hidden=false; p.scrollTop=0;
  }

  function roundRect(c,x,y,w,h,r){
    c.beginPath(); c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  }
  function downloadTierImage(){
    try{
      const t=theme(), bands=tierBands();
      const W=1100, pad=44, keyW=120, gap=14, lineH=34, titleH=118;
      const probe=document.createElement("canvas").getContext("2d");
      probe.font="400 20px ui-sans-serif, system-ui, -apple-system, sans-serif";
      const colW=W-pad*2-keyW-gap;
      bands.forEach(b=>{
        b.lines=b.items.map(it=>{
          let s=it.n+".  "+it.e.text;
          while(probe.measureText(s).width>colW-28 && s.length>6) s=s.slice(0,-2)+"…";
          return s;
        });
        b.h=Math.max(70, b.lines.length*lineH+24);
      });
      const H=titleH+bands.reduce((a,b)=>a+b.h+12,0)+pad;
      const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
      const c=cv.getContext("2d");
      c.fillStyle=t.c[0]; c.fillRect(0,0,W,H);
      c.fillStyle=t.c[3];
      c.font="600 40px ui-sans-serif, system-ui, -apple-system, sans-serif";
      c.fillText(listName(), pad, pad+40);
      c.fillStyle=t.c[4];
      c.font="400 19px ui-monospace, SFMono-Regular, Menlo, monospace";
      c.fillText(state.entries.filter(e=>e.text).length+" things, cut on a normal curve", pad, pad+72);

      let y=titleH;
      bands.forEach(b=>{
        c.fillStyle=b.t.c; roundRect(c,pad,y,keyW,b.h,12); c.fill();
        c.fillStyle="#15130F"; c.textAlign="center";
        c.font="600 34px ui-monospace, SFMono-Regular, Menlo, monospace";
        c.fillText(b.t.k, pad+keyW/2, y+b.h/2+2);
        c.font="400 14px ui-monospace, SFMono-Regular, Menlo, monospace";
        c.fillStyle="rgba(21,19,15,.7)";
        c.fillText(String(b.items.length), pad+keyW/2, y+b.h/2+24);
        c.textAlign="left";

        c.fillStyle=t.c[1]; roundRect(c,pad+keyW+gap,y,colW,b.h,12); c.fill();
        if(!b.lines.length){
          c.fillStyle=t.c[4]; c.font="400 16px ui-monospace, monospace";
          c.fillText("empty", pad+keyW+gap+18, y+b.h/2+6);
        }else{
          c.fillStyle=t.c[3];
          c.font="400 20px ui-sans-serif, system-ui, -apple-system, sans-serif";
          b.lines.forEach((s,i)=> c.fillText(s, pad+keyW+gap+18, y+32+i*lineH));
        }
        y+=b.h+12;
      });

      const finish=url=>{
        const a=document.createElement("a");
        a.href=url; a.download=fileStem()+"-tiers-"+stamp()+".png";
        document.body.append(a); a.click(); a.remove();
        toast("Tier image saved",null); closeSheet();
      };
      if(cv.toBlob) cv.toBlob(b=>{
        if(!b){ finish(cv.toDataURL("image/png")); return; }
        const url=URL.createObjectURL(b); finish(url);
        setTimeout(()=>URL.revokeObjectURL(url),3000);
      },"image/png");
      else finish(cv.toDataURL("image/png"));
    }catch(err){ copy(tiersAsText(),"Image failed — tiers copied as text"); }
  }

  $("undoBtn").onclick=undo;
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ if(duel) duelCancel(); else closeSheet(); return; }
    if((e.metaKey||e.ctrlKey) && String(e.key).toLowerCase()==="z"){
      if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
      e.preventDefault();
      if(e.shiftKey) redo(); else undo();
    }
  });

  // offline support once installed; skipped when opened as a file
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }

  load();
})();
</script>
