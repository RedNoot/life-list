<!DOCTYPE html>
<html lang="en" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="A private, ranked list of everything you've done. Runs in your browser and saves on your device.">
<meta name="theme-color" content="#FBF3E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life list">
<title>Life list</title>
<!-- AppReporter: automatic crash reports, no feedback button. In the portfolio, Netlify stamps data-version at build. -->
<script src="app-reporter.js" data-app="lifelist" data-endpoint="https://app-reporter.app-reporter-relay.workers.dev"
        data-version="0-dev" data-button="false"></script>
<script>
  // The list is private: quoted text in an error message could be one of its lines, so it never leaves the device.
  window.AppReporter && AppReporter.init({ beforeSend: function (r) {
    var q = /"[^"]*"|'[^']*'|“[^”]*”|‘[^’]*’/g;
    r.message = r.message.replace(q, '"…"'); r.stack = r.stack.replace(q, '"…"');
    return r;
  } });
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="baseFonts" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link id="themeFonts" rel="stylesheet">
<style>
  /* Defaults match the Sunbaked theme so the first paint looks like the usual
     pick; applyTheme() overwrites every one of these from THEMES. */
  :root{
    --ink:#FBF3E0; --ink-2:#F4E7CB; --ink-3:#E4D3B0;
    --bone:#231F1A; --mute:#6B6459;
    --gold:#D63A1C; --rose:#0B7A6E; --on-gold:#FBF3E0;
    --line:rgba(214,58,28,.26); --grid:rgba(35,31,26,.12);
    --serif:"Work Sans",system-ui,sans-serif;
    --mono:"Syne",system-ui,sans-serif;
    --entry:17px; --pad:16px; --col:720px;
    --anim-num:numStamp .6s cubic-bezier(.2,1.3,.4,1);
    --anim-row:rowOffset .4s ease-out;
  }
  html{color-scheme:light;background:var(--ink)}
  html[data-scheme="dark"]{color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0 auto;max-width:var(--col);background:var(--ink);color:var(--bone);font-family:var(--serif);display:flex;flex-direction:column;overscroll-behavior-y:none;transition:background .25s,color .25s}
  body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  body.dragging main{touch-action:none}
  body.dragging .milestone{visibility:hidden}
  body.dragging .add-below{opacity:0}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit;background:none;border:0;outline:none}
  ::selection{background:var(--rose);color:var(--on-gold)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

  header{padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 0;flex:0 0 auto}
  .titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
  .count{font-family:var(--mono);font-weight:600;font-size:26px;letter-spacing:-.01em;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
  .count small{font-weight:400;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-left:8px}
  .tools{display:flex;gap:2px;align-items:center}
  .icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--mute);font-family:var(--mono);font-size:14px}
  .icon-btn:hover,.icon-btn:focus-visible{color:var(--bone);background:var(--ink-3)}
  .icon-btn[aria-pressed="true"]{color:var(--gold)}
  .icon-btn[hidden]{display:none}

  .searchbar{display:none;padding:12px var(--pad) 0;gap:10px;align-items:center}
  .searchbar.on{display:flex}
  .searchbar input{flex:1;font-family:var(--mono);font-size:13px;letter-spacing:.03em;padding:9px 12px;background:var(--ink-2);border-radius:10px}
  .searchbar input::placeholder{color:var(--mute)}

  .controls{display:flex;gap:8px;align-items:center;padding:14px var(--pad) 12px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
  .controls::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:999px;border:1px solid var(--ink-3);color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:.14s}
  .chip:hover{border-color:var(--mute)}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .chip .n{opacity:.5;font-size:10px}
  .chip[aria-pressed="true"]{background:var(--ink-3);color:var(--bone);border-color:transparent}
  .chip.sort,.chip.year{border-style:dashed;color:var(--gold);border-color:var(--line)}
  .chip.today{color:var(--rose);border-color:var(--line)}
  .chip.today[aria-pressed="true"]{background:var(--ink-3);color:var(--rose)}
  .divider{flex:0 0 auto;width:1px;height:18px;background:var(--ink-3)}

  #override{flex:0 0 auto;padding:0 var(--pad) 10px}
  #override:empty{display:none}
  .override{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border:1px dashed var(--line);border-radius:11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .override span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .override button{margin-left:auto;flex:0 0 auto;color:var(--gold);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--line)}
  main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
  .list{position:relative;padding:2px 0 8px}
  .list:has(> .note)::before{display:none}
  .list::before{content:"";position:absolute;left:43px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,transparent,var(--line) 6%,var(--line) 94%,transparent)}
  .row{display:grid;grid-template-columns:44px 1fr 34px;align-items:start;padding:9px var(--pad) 9px 0;position:relative;transition:box-shadow .2s ease,background-color .2s ease}
  .row:not(.editing):hover{background:rgba(127,127,127,.06)}
  .row.lifted{background:var(--ink-2);border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.4);z-index:5;touch-action:none;will-change:transform;cursor:grabbing}
  .row.dropping{box-shadow:0 0 0 rgba(0,0,0,0);background-color:transparent;z-index:5}
  .row.lifted .num{color:var(--gold);background:var(--ink-2)}
  @media (pointer:coarse){ .row .text{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none} }
  .row.enter{animation:var(--anim-row)}
  .row.jump{animation:jump 1.6s ease-out}
  @keyframes jump{0%,40%{background:var(--line)}100%{background:transparent}}
  .num{grid-column:1;justify-self:center;position:relative;z-index:1;font-family:var(--mono);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--mute);background:var(--ink);padding:3px 2px;line-height:1.2;margin-top:3px;border-radius:5px}
  .num.handle{cursor:grab;touch-action:none}
  .num.handle:hover{color:var(--gold);box-shadow:0 0 0 1px var(--line)}
  .num input{width:38px;text-align:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--on-gold);background:var(--gold);border-radius:5px;padding:3px 0;letter-spacing:0}
  .row.flash .num{animation:var(--anim-num)}
  .body{grid-column:2;min-width:0}
  .text{font-size:var(--entry);line-height:1.42;letter-spacing:.004em;word-break:break-word;text-align:left;width:100%;padding:0;display:block}
  .meta{display:flex;flex-wrap:wrap;gap:5px 9px;margin-top:6px;align-items:center}
  .tag,.date{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;color:var(--mute)}
  .tag .dot{width:5px;height:5px;border-radius:50%}
  .date{opacity:.75}
  .add-below{grid-column:3;justify-self:end;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--ink-2);color:var(--gold);font-family:var(--mono);font-size:15px;line-height:1;display:grid;place-items:center;margin-top:3px;transition:.14s}
  .add-below:hover,.add-below:focus-visible{color:var(--on-gold);background:var(--gold);border-color:transparent}
  .group{display:grid;grid-template-columns:44px 1fr;padding:20px var(--pad) 7px 0}
  .group span{grid-column:2;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
  .group span::after{content:"";flex:1;height:1px;background:var(--ink-3)}
  .milestone{display:grid;grid-template-columns:44px 1fr;padding:14px var(--pad) 14px 0;align-items:center}
  .milestone b{grid-column:1;justify-self:center;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--on-gold);background:var(--gold);border-radius:999px;padding:3px 6px;position:relative;z-index:1}
  .milestone span{grid-column:2;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px}
  .milestone span::after{content:"";flex:1;height:1px;background:var(--line)}

  .row.editing{background:var(--ink-2);border-radius:12px;margin:4px 8px 4px 0;padding-top:12px;padding-bottom:10px}
  .edit-text{width:100%;resize:none;font-family:var(--serif);font-size:var(--entry);line-height:1.42;border-bottom:1px solid var(--line);padding-bottom:6px}
  .edit-tags{width:100%;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--gold);margin-top:10px;padding:4px 0}
  .edit-tags::placeholder{color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-size:10px}
  .edit-date{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
  .edit-date input{font-family:var(--mono);font-size:12px;color:var(--bone);background:var(--ink-3);padding:6px 9px;border-radius:8px;letter-spacing:0}
  .edit-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border-radius:999px;border:1px solid var(--ink-3);color:var(--mute)}
  .btn:hover{color:var(--bone);border-color:var(--mute)}
  .btn.primary{background:var(--gold);color:var(--on-gold);border-color:transparent;font-weight:600}
  .btn.danger{margin-left:auto;color:var(--rose);border-color:transparent}

  .note{padding:52px var(--pad);text-align:center;color:var(--mute);font-size:16px;line-height:1.6}
  .note b{display:block;color:var(--bone);font-weight:500;margin-bottom:6px}

  footer{flex:0 0 auto;background:var(--ink);border-top:1px solid var(--ink-3);padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 10px)}
  .quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:9px}
  .quick::-webkit-scrollbar{display:none}
  .quick .chip{padding:5px 10px;font-size:10px}
  .compose{display:flex;align-items:flex-end;gap:10px}
  .compose textarea{flex:1;resize:none;font-family:var(--serif);font-size:var(--entry);line-height:1.4;max-height:120px;padding:9px 0}
  .compose textarea::placeholder{color:var(--mute)}
  .send{width:40px;height:40px;flex:0 0 auto;border-radius:50%;background:var(--ink-3);color:var(--mute);display:grid;place-items:center;font-size:17px;transition:.16s}
  .send.ready{background:var(--gold);color:var(--on-gold)}
  .listbtn{display:inline-flex;align-items:center;gap:7px;max-width:62vw;padding:2px 0;border-radius:4px}
  .listbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .listbtn i{font-style:normal;font-size:9px;color:var(--gold);letter-spacing:0}
  .listbtn:hover span{text-decoration:underline;text-underline-offset:3px}
  .sheet .namefield{display:flex;gap:8px;padding:0 12px 12px}
  .sheet .namefield input{flex:1;min-width:0;font-family:var(--serif);font-size:16px;padding:10px 12px;background:var(--ink);border-radius:10px}
  .chip.addtag{color:var(--gold);border-style:dashed;border-color:var(--line)}
  .willtag{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .willtag:empty{display:none}
  .willtag .wt{display:inline-flex;align-items:center;gap:4px;padding:3px 3px 3px 9px;border-radius:999px;background:var(--ink-3);color:var(--bone)}
  .willtag .wt.typed{background:none;border:1px dashed var(--line);padding-right:9px}
  .willtag .wt .dot{width:5px;height:5px;border-radius:50%}
  .willtag .wt button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--mute);font-size:13px;line-height:1}
  .willtag .wt button:hover{color:var(--bone)}
  .willtag .tip{text-transform:none;letter-spacing:.02em;font-size:11.5px}
  .newtag{display:flex;gap:8px;padding:0 12px 12px}
  .newtag input{flex:1;min-width:0;font-family:var(--mono);font-size:16px;padding:9px 12px;background:var(--ink);border-radius:10px}
  .tagpick{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
  .sheet .para{padding:0 12px 10px;font-size:14px;line-height:1.5;color:var(--mute)}
  .edit-tagchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .edit-tagchips .chip{padding:4px 9px;font-size:10px}
  .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);opacity:.6;margin-top:7px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 108px);background:var(--ink-3);border:1px solid var(--grid);border-radius:999px;padding:9px 10px 9px 16px;display:flex;align-items:center;gap:12px;z-index:80;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 12px 30px rgba(0,0,0,.3)}
  .toast button{color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--line)}
  .toast[hidden],.sheet[hidden],.panel[hidden],.scrim[hidden]{display:none}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--ink-2);border-top:1px solid var(--ink-3);border-radius:20px 20px 0 0;padding:8px 8px calc(env(safe-area-inset-bottom) + 12px);max-height:82vh;overflow-y:auto;box-shadow:0 -18px 50px rgba(0,0,0,.3)}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--ink-3);margin:6px auto 10px}
  .sheet h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:14px 12px 6px;font-weight:400}
  .sheet button.item{display:flex;width:100%;align-items:center;gap:12px;text-align:left;font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;padding:12px;border-radius:11px;color:var(--bone)}
  .sheet button.item:hover{background:var(--ink-3)}
  .sheet button.item .r{margin-left:auto;color:var(--mute);font-size:11px}
  .sheet button.item.danger{color:var(--rose)}
  .sheet textarea{width:100%;height:120px;background:var(--ink);border-radius:12px;padding:12px;font-family:var(--mono);font-size:11px;line-height:1.5;margin:4px 0 8px}

  .themes{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 8px 8px}
  .tcard{border-radius:13px;padding:11px 12px;text-align:left;border:1px solid transparent;position:relative;overflow:hidden;transition:transform .12s}
  .tcard:active{transform:scale(.97)}
  .tcard .tn{font-size:14px;font-weight:500;letter-spacing:.01em;margin-bottom:9px;display:block}
  .tcard .sw{display:flex;gap:5px;align-items:center}
  .tcard .sw i{width:14px;height:14px;border-radius:50%;display:block}
  .tcard .tick2{position:absolute;top:9px;right:10px;font-size:11px;font-family:var(--mono)}

  .panel{position:fixed;inset:0;z-index:97;background:var(--ink);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) calc(env(safe-area-inset-bottom) + 40px)}
  .panel .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .panel h2{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:400;margin:0}
  .panel h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:400;margin:30px 0 12px;display:flex;align-items:center;gap:8px}
  .panel h3::after{content:"";flex:1;height:1px;background:var(--ink-3)}
  .big{font-family:var(--mono);font-weight:600;font-size:40px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;margin:10px 0 4px}
  .sub{font-size:15px;color:var(--mute);line-height:1.5}
  .barrow{display:grid;grid-template-columns:78px 1fr 34px;gap:10px;align-items:center;margin-bottom:7px}
  .barrow .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barrow .track{height:9px;background:var(--grid);border-radius:99px;overflow:hidden}
  .barrow .fill{height:100%;border-radius:99px}
  .barrow .val{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
  .months{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:6px}
  .months div{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
  .mlabels{display:flex;gap:3px;margin-top:6px}
  .mlabels span{flex:1;font-family:var(--mono);font-size:8px;letter-spacing:.06em;color:var(--mute);text-align:center;text-transform:uppercase}
  .heatwrap{display:flex;gap:7px;align-items:flex-start;margin-top:10px}
  .hdays{display:flex;flex-direction:column;gap:3px;padding-top:16px;flex:0 0 auto}
  .hdays span{height:10px;line-height:10px;width:22px;text-align:right;font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
  .hscroll{flex:1 1 auto;overflow-x:auto;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}
  .hmonths{display:flex;gap:3px;height:13px;margin-bottom:3px}
  .hmonths span{flex:0 0 10px;width:10px;position:relative}
  .hmonths span b{position:absolute;left:0;top:0;font-weight:400;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
  .heat{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .heat::-webkit-scrollbar{display:none}
  .heat .wk{display:flex;flex-direction:column;gap:3px}
  .heat .d{width:10px;height:10px;border-radius:2px;background:var(--grid)}
  .legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
  .legend .d{width:10px;height:10px;border-radius:2px}
  .yearcard{border:1px solid var(--ink-3);border-radius:14px;padding:14px;margin-bottom:10px}
  .yearcard .yh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .yearcard .yy{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--bone)}
  .yearcard .yc{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
  .yearcard .yt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .yearcard .sample{font-size:15px;line-height:1.45;color:var(--mute)}
  .yearcard .sample b{color:var(--bone);font-weight:400}
  .mix{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:10px}
  .mix i{display:block;min-width:2px}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}

  /* ---------- colour maths ---------- */
  function hexRgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function rgba(hex,a){ const [r,g,b]=hexRgb(hex); return "rgba("+r+","+g+","+b+","+a+")"; }
  function hexHsl(hex){
    let [r,g,b]=hexRgb(hex).map(v=>v/255);
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
    let h=0; if(d){ if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; }
    h=Math.round(h*60); if(h<0) h+=360;
    const l=(mx+mn)/2, s=d? d/(1-Math.abs(2*l-1)) : 0;
    return [h, Math.round(s*100), Math.round(l*100)];
  }

  /* ---------- theme ---------- */
  function applyTheme(){
    const t = theme(), r = document.documentElement, s = r.style;
    const names = ["--ink","--ink-2","--ink-3","--bone","--mute","--gold","--rose","--on-gold"];
    names.forEach((n,i)=> s.setProperty(n, t.c[i]));
    s.setProperty("--line", rgba(t.c[5], t.scheme==="light" ? .26 : .18));
    s.setProperty("--grid", rgba(t.c[3], t.scheme==="light" ? .12 : .08));
    s.setProperty("--serif", t.serif);
    s.setProperty("--mono", t.mono);
    s.setProperty("--entry", (17*(t.scale||1)).toFixed(1)+"px");
    s.setProperty("--anim-num", t.num);
    s.setProperty("--anim-row", t.row);
    r.setAttribute("data-scheme", t.scheme);
    r.setAttribute("data-theme", t.id);
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", t.c[0]);
    const link = $("themeFonts");
    const href = "https://fonts.googleapis.com/css2?"+t.g+"&display=swap";
    if(link.getAttribute("href")!==href) link.setAttribute("href", href);
    const hsl = hexHsl(t.c[5]);
    baseHue = hsl[0]; baseSat = Math.max(45, Math.min(88, hsl[1]));
    tagLight = t.scheme==="light" ? 45 : 64;
  }
  function tagHue(n){
    let h=0; for(let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0;
    return (baseHue + (h%8)*45 + (h%3)*11) % 360;
  }
  function tagColor(n){ return "hsl("+tagHue(n)+" "+baseSat+"% "+tagLight+"%)"; }

  /* ---------- storage ---------- */
  /* Several lists. The first one stays under KEY ("lifelist:v1"), exactly
     where older versions kept the only list, so nothing has to move. The
     index names the lists and which is open; prefs (theme, toggles) are
     shared by every list. Older versions kept prefs inside KEY, so that is
     where they are read from until the prefs key exists. */
  const INDEX_KEY = "lifelist:lists", PREFS_KEY = "lifelist:prefs";
  let lists = { lists:[{id:"main",name:"Life list",key:KEY}], current:"main" };
  const curList = () => lists.lists.find(l=>l.id===lists.current) || lists.lists[0];
  const listName = () => curList().name;
  async function readJSON(key){
    try{ const r=await store.get(key); return r && r.value ? JSON.parse(r.value) : null; }catch(e){ return null; }
  }
  function applyPrefs(d){
    if(!d) return;
    state.showTags = d.showTags !== false;
    state.showDates= d.showDates !== false;
    state.haptics  = d.haptics !== false;
    state.seeded   = !!d.seeded;
    state.purged   = !!d.purged;
    state.duels    = d.duels !== false;
    state.tint     = d.tint !== false;
    let th = d.theme || state.theme;
    if(th==="dark") th="inkwell"; if(th==="light") th="paper";
    if(THEMES.some(t=>t.id===th)) state.theme = th;
  }
  async function readList(list){
    const d = await readJSON(list.key) || {};
    const entries = Array.isArray(d.entries) ? d.entries : [];
    entries.forEach(e=>{ if(!("on" in e)) e.on=null; if(!("tm" in e)) e.tm=null; });
    let so=d.sort||"rank";
    if(so==="added") so="rank"; if(so==="newest") so="rankdesc";
    return { entries, nextId:d.nextId || entries.length+1, sort:["rank","rankdesc","tag","az"].includes(so) ? so : "rank" };
  }
  async function openList(list){
    const d = await readList(list);
    state.entries=d.entries; state.nextId=d.nextId; state.sort=d.sort;
  }
  const writeIndex = () => store.set(INDEX_KEY, JSON.stringify(lists)).catch(()=>{});

  async function load(){
    const idx = await readJSON(INDEX_KEY);
    if(idx && Array.isArray(idx.lists) && idx.lists.length){
      lists = { lists: idx.lists.filter(l=>l && l.id && l.key), current: idx.current };
      applyPrefs(await readJSON(PREFS_KEY) || await readJSON(KEY));
    }else{
      // first run of this version: the one existing list (if any) becomes list 1
      applyPrefs(await readJSON(KEY));
      await writeIndex();
    }
    if(!lists.lists.some(l=>l.id===lists.current)) lists.current = lists.lists[0].id;
    await openList(curList());
    if(!state.purged){
      const n=state.entries.filter(e=>e.sample).length;
      if(n){
        state.entries=state.entries.filter(e=>!e.sample);
        if(!state.entries.length) state.nextId=1;
        setTimeout(()=>toast("Cleared "+n+" sample entries",null),700);
      }
      state.purged=true; state.seeded=true; save();
    }
    state.loaded=true; applyTheme();
    // ask the browser not to evict the list under storage pressure
    try{ if(store.mode==="local" && navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    if(store.mode==="memory") setTimeout(()=>toast("Nothing can be saved here — back up before closing",null),900);
    const l=$("loading"); if(l) l.remove();
    render();
  }
  const prefsBlob = () => ({
    showTags:state.showTags, showDates:state.showDates, theme:state.theme,
    haptics:state.haptics, seeded:state.seeded, purged:state.purged,
    duels:state.duels, tint:state.tint
  });
  async function writeNow(){
    clearTimeout(saveTimer); saveTimer=null;
    const list=curList();
    const blob={ entries:state.entries, nextId:state.nextId, sort:state.sort };
    // list 1 keeps the old all-in-one shape, so an older cached copy of the
    // app opened offline still finds its settings (and won't re-run the purge)
    if(list.key===KEY) Object.assign(blob, prefsBlob());
    try{
      await store.set(list.key, JSON.stringify(blob));
      await store.set(PREFS_KEY, JSON.stringify(prefsBlob()));
    }catch(e){ toast("Couldn’t save — try again", null); }
  }
  function save(){
    clearTimeout(saveTimer);

  // don't lose a change made just before the tab closes or the app is swiped away

  /* ---------- lists ---------- */
  // everything that belongs to the list on screen, dropped when another opens
  function resetListScope(){

    state.editingId=null; state.numEditing=null; state.pendingTags=[]; state.dropFilterTag=false;

  async function switchList(id){
    if(id===lists.current) return;
    await writeNow();                       // the old list's last edit goes to the old list
    lists.current=id; await writeIndex();
    resetListScope();
    await openList(curList());
    $("main").scrollTop=0; render();
  }
  async function createList(name){
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    lists.lists.push({id, name, key:"lifelist:list:"+id});
    await writeIndex();
    await switchList(id);

  async function renameList(id,name){
    const l=lists.lists.find(x=>x.id===id); if(!l) return;
    l.name=name; await writeIndex(); render();
  }
  async function deleteList(id){
    if(lists.lists.length<2) return;
    const l=lists.lists.find(x=>x.id===id); if(!l) return;
    if(!confirm("Delete the list “"+l.name+"” and everything in it? Back it up first — this can’t be undone.")) return;
    if(id===lists.current){
      clearTimeout(saveTimer); saveTimer=null;   // nothing left to save for it
      lists.current=lists.lists.find(x=>x.id!==id).id;
      resetListScope();
      await openList(curList());
    }
    lists.lists=lists.lists.filter(x=>x.id!==id);
    await writeIndex();
    try{ await store.del(l.key); }catch(e){}
    $("main").scrollTop=0; render();
    toast("List deleted", null);
  }
  const cleanName = s => String(s||"").replace(/\s+/g," ").trim().slice(0,40);
  function askName(title, initial, okLabel, done){
    openSheet(s=>{
      s.append(el("h4",null,title));
      const row=el("div","namefield");
      const inp=document.createElement("input");
      inp.value=initial||""; inp.maxLength=40; inp.placeholder="e.g. Places I’ve been"; inp.autocomplete="off";
      inp.setAttribute("aria-label","List name");
      const ok=el("button","btn primary",okLabel);
      const go=()=>{ const n=cleanName(inp.value); if(!n){ inp.focus(); return; } closeSheet(); done(n); };
      ok.onclick=go;
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } });
      row.append(inp, ok); s.append(row);

  }
  async function openLists(){
    await writeNow();                          // so the counts below are current
    const counts=await Promise.all(lists.lists.map(async l=>
      l.id===lists.current ? state.entries.filter(e=>e.text).length : (await readList(l)).entries.filter(e=>e.text).length));
    openSheet(s=>{
      s.append(el("h4",null,"Your lists"));
      lists.lists.forEach((l,i)=>{
        const on=l.id===lists.current;
        const b=item(l.name, counts[i]+(counts[i]===1?" thing":" things")+(on?"  ✓":""), ()=>{ closeSheet(); switchList(l.id); });
        b.setAttribute("data-report","list");     // crash reports name the button, never the list
        if(on) b.setAttribute("aria-current","true");
        s.append(b);
      });
      s.append(item("+ New list",null,()=>askName("Name your new list","","Create",createList)));
      s.append(el("h4",null,"This list"));
      s.append(item("Rename it",null,()=>askName("Rename this list",listName(),"Save",n=>renameList(lists.current,n))));
      if(lists.lists.length>1) s.append(item("Delete it", null, ()=>{ closeSheet(); deleteList(lists.current); }, "danger"));
      s.append(el("div","para","Each list has its own entries and ranking. Theme and settings are shared."));
    });
  }
  $("listBtn").onclick=openLists;

  /* ---------- helpers ---------- */
  const cleanTag = t => t.trim().toLowerCase().replace(/^#/,"").replace(/\s+/g," ").slice(0,20);
  function parseEntry(raw){
    let text=String(raw||"").trim(); const tags=[];
    text = text.replace(/(^|\s)#([\p{L}\p{N}\-_]{1,20})/gu,(m,pre,t)=>{tags.push(cleanTag(t));return pre;});
    const m = text.match(/\s+[-–—]\s+([^-–—]{1,40})$/);
    if(m){
      const parts=m[1].split(",").map(cleanTag).filter(Boolean);
      if(parts.length && parts.every(p=>p.split(" ").length<=2)){ tags.push(...parts); text=text.slice(0,m.index); }
    }
    return {text:text.replace(/\s+/g," ").trim(), tags:dedupe(tags)};
  }
  const when = e => e.on ? new Date(e.on+"T"+(e.tm||"12:00")+":00") : new Date(e.at);
  const iso = d => d.getFullYear()+"-"+((d.getMonth()+1)<10?"0":"")+(d.getMonth()+1)+"-"+(d.getDate()<10?"0":"")+d.getDate();
  const pad2 = n => (n<10?"0":"")+n;
  function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function nowHM(){ const d=new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
  function stampNow(){ return {at:Date.now(), on:todayISO(), tm:nowHM()}; }

  function addSamples(){
    const now=Date.now();
    SAMPLES.forEach((s,i)=>{
      const bits=s.split("|");
      const at = now - (((i*7 + (i%5)*13) % 340)*864e5) - ((i*3607)%86400)*1000;
      state.entries.push({
        id:state.nextId++, text:bits[0],
        tags:(bits[1]||"").split(",").map(cleanTag).filter(Boolean),
        at, on:bits[2]||null, tm:bits[3]||null, sample:true
      });
    });
  }
  const sampleCount = () => state.entries.filter(e=>e.sample).length;
  function removeSamples(){
    const n=sampleCount();
    state.entries=state.entries.filter(e=>!e.sample);
    save(); render(); toast("Removed "+n+" sample entries", null);
  }
  function allTags(){
    const c=new Map();
    state.entries.forEach(e=>(e.tags||[]).forEach(t=>c.set(t,(c.get(t)||0)+1)));
    return [...c.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  }
  const allYears = () => [...new Set(state.entries.filter(e=>e.text).map(e=>when(e).getFullYear()))].sort((a,b)=>b-a);
  function isToday(e){
    const now=new Date(), d=when(e);
    if(d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()) return false;
    const a=new Date(2000,now.getMonth(),now.getDate()), b=new Date(2000,d.getMonth(),d.getDate());
    let diff=Math.abs(a-b)/864e5; if(diff>182) diff=365-diff;
    return diff<=3;
  }
  const todayCount = () => state.entries.filter(e=>e.text&&isToday(e)).length;
  const rankView = () => state.sort==="rank" && !state.filter && !state.year && !state.today && !state.query.trim();

  function visible(){
    let rows = state.entries.map((e,i)=>({e,master:i}));
    if(state.filter) rows=rows.filter(r=>(r.e.tags||[]).includes(state.filter));
    if(state.year) rows=rows.filter(r=>String(when(r.e).getFullYear())===state.year);
    if(state.today) rows=rows.filter(r=>isToday(r.e));
    const q=state.query.trim();
    let scored=false;
    if(q && !/^#?\d+$/.test(q)){
      rows=rows.map(r=>{ r.score=matchScore(r.e,q); return r; }).filter(r=>r.score>0);
      scored=true;
    }
    if(scored && state.sort==="rank") rows.sort((a,b)=> b.score-a.score || a.master-b.master);
    else if(state.sort==="az") rows.sort((a,b)=>a.e.text.localeCompare(b.e.text,undefined,{sensitivity:"base"}));
    else if(state.sort==="rankdesc") rows.reverse();
    else if(state.sort==="tag") rows.sort((a,b)=>{
      const ta=(a.e.tags||[])[0]||"\uffff", tb=(b.e.tags||[])[0]||"\uffff";
      return ta.localeCompare(tb)||a.master-b.master;
    });
    return rows;
  }

  /* ---------- mutations ---------- */
  function addEntry(raw){
    const p=parseEntry(raw); if(!p.text) return;
    const tags=dedupe([...p.tags,...state.pendingTags,...(state.filter&&!state.dropFilterTag?[state.filter]:[])]);
    const e=Object.assign({id:state.nextId++,text:p.text,tags}, stampNow());
    state.pendingTags=[]; state.dropFilterTag=false; buzz(8);
    const dup=findSimilar(e.text);
    if(dup) confirmDuplicate(e,dup); else placeEntry(e);
  }
  function placeEntry(e){
    if(duelsPossible()) startDuel(e,x=>finishPlacement(x,state.entries.length));
    else { pushUndo("adding “"+shorten(e.text)+"”"); state.entries.push(e); justAdded=e.id; save(); render(); }
  }
  function confirmDuplicate(e,dup){
    openSheet(s=>{
      s.append(el("h4",null,"You may already have this"));
      const info=el("div");
      info.style.cssText="padding:0 12px 6px;font-size:15px;line-height:1.5;color:var(--mute)";
      info.textContent="Rank "+dup.rank+" reads: “"+dup.entry.text+"”.";
      s.append(info);
      s.append(item("Add it anyway",null,()=>{ closeSheet(); placeEntry(e); }));
      s.append(item("Take me to rank "+dup.rank,null,()=>{ closeSheet(); jumpTo=dup.rank; render(); }));
      s.append(item("Never mind",null,closeSheet));
    });
  }
  function insertAfter(master){
    pushUndo("inserting a line");
    const e=Object.assign({id:state.nextId++,text:"",tags:state.filter?[state.filter]:[],fresh:true}, stampNow());
    state.entries.splice(master+1,0,e);
    state.editingId=e.id; buzz(8); save(); render();
  }
  function removeEntry(id){
    const i=state.entries.findIndex(e=>e.id===id); if(i<0) return;
    pushUndo("deleting “"+shorten(state.entries[i].text)+"”");
    state.entries.splice(i,1); state.editingId=null; save(); render();
    toast("Deleted", undo);
  }

  /* ---------- render ---------- */
  function render(){ if(!state.loaded) return; $("listName").textContent=listName(); renderCount(); renderControls(); renderOverride(); renderQuick(); renderList(); renderUndoBtn(); }

  function renderOverride(){
    const box=$("override"); box.textContent="";
    if(rankView()) return;
    const bits=[];
    const labels={rankdesc:"Highest first",tag:"Grouped by tag",az:"A–Z"};
    if(labels[state.sort]) bits.push(labels[state.sort]);
    if(state.filter) bits.push("#"+state.filter);
    if(state.year) bits.push(state.year);
    if(state.today) bits.push("On this day");
    if(state.query.trim()) bits.push("“"+state.query.trim()+"”");
    const bar=el("div","override");
    bar.append(el("span",null,"Temporary view · "+bits.join(" · ")+" · ranks kept"));
    const b=el("button",null,"Back to ranking");
    b.onclick=()=>{
      state.sort="rank"; state.filter=null; state.year=null; state.today=false; state.query="";
      const si=$("search"); if(si) si.value="";
      $("searchbar").classList.remove("on"); $("searchBtn").setAttribute("aria-pressed","false");
      save(); render();
    };
    bar.append(b); box.append(bar);
  }

  function renderCount(){
    const n=state.entries.filter(e=>e.text).length, c=$("count");
    c.textContent=""; c.append(String(n), el("small",null,n===1?"thing":"things"));
  }

  function renderControls(){
    const box=$("controls"); box.textContent="";
    const sortLabels={rank:"By rank · 1 to end",rankdesc:"By rank · highest first",tag:"Grouped by tag",az:"A–Z"};
    const sBtn=el("button","chip sort","↕ "+sortLabels[state.sort]);
    sBtn.onclick=()=>openPicker("Order the list by", Object.keys(sortLabels).map(k=>({
      label:sortLabels[k], on:state.sort===k, go:()=>{ state.sort=k; save(); render(); }
    })));
    box.append(sBtn);

    const years=allYears();
    if(years.length>1){
      const yBtn=el("button","chip year", state.year?"◷ "+state.year:"◷ Any year");
      const items=[{label:"Any year",on:!state.year,go:()=>{state.year=null;render();}}]
        .concat(years.map(y=>({label:String(y),on:state.year===String(y),go:()=>{state.year=String(y);render();}})));
      yBtn.onclick=()=>openPicker("Show which year", items);
      box.append(yBtn);
    }

    const tc=todayCount();
    if(tc){
      const t=el("button","chip today","✦ On this day "+tc);
      t.setAttribute("aria-pressed",String(state.today));
      t.onclick=()=>{ state.today=!state.today; render(); };
      box.append(t);
    }

    const tags=allTags();
    if(tags.length){
      box.append(el("div","divider"));
      const all=el("button","chip","All");
      all.setAttribute("aria-pressed",String(!state.filter));
      all.onclick=()=>{ state.filter=null; render(); };
      box.append(all);
      tags.forEach(([t,n])=>{
        const b=el("button","chip"); const d=el("span","dot"); d.style.background=tagColor(t);
        b.append(d, el("span",null,t), el("span","n",String(n)));
        b.setAttribute("aria-pressed",String(state.filter===t));
        b.onclick=()=>{ state.filter=state.filter===t?null:t; state.dropFilterTag=false; render(); };
        box.append(b);
      });
    }
  }

  const togglePending = t => {
    state.pendingTags = state.pendingTags.includes(t) ? state.pendingTags.filter(x=>x!==t) : [...state.pendingTags,t];
  };
  function renderQuick(){
    const box=$("quick"); box.textContent="";
    const add=el("button","chip addtag","# Tag");
    add.setAttribute("aria-label","Choose tags for the next entry");
    add.onclick=openTagPicker;
    box.append(add);
    allTags().slice(0,10).forEach(([t])=>{
      const b=el("button","chip"); const d=el("span","dot"); d.style.background=tagColor(t);
      b.append(d, el("span",null,t));
      b.setAttribute("aria-pressed",String(state.pendingTags.includes(t)));
      b.onclick=()=>{ togglePending(t); renderComposerTags(); $("input").focus(); };
      box.append(b);
    });
    renderWillTag();
  }
  const renderComposerTags = () => renderQuick();

  /* every tag the next entry will get, and where it comes from — so the
     " - tag" syntax shows itself working as you type */
  function composerTags(){
    const typed=parseEntry($("input").value).tags;
    const out=typed.map(t=>({t,from:"typed"}));
    state.pendingTags.forEach(t=>{ if(!typed.includes(t)) out.push({t,from:"picked"}); });
    if(state.filter && !state.dropFilterTag && !out.some(x=>x.t===state.filter)) out.push({t:state.filter,from:"filter"});
    return out;
  }
  function renderWillTag(){
    const box=$("willtag"); box.textContent="";
    const text=$("input").value.trim();
    const tags=composerTags();
    if(!tags.length){
      if(text) box.append(el("span","tip","No tags yet. End with “ - food” to tag it, or tap # Tag."));
      return;
    }
    box.append(el("span",null,"Tags"));
    tags.forEach(({t,from})=>{
      const c=el("span","wt"+(from==="typed"?" typed":""));
      const d=el("span","dot"); d.style.background=tagColor(t);
      c.append(d, el("span",null, from==="filter" ? t+" · filter" : t));
      if(from!=="typed"){
        const x=el("button",null,"×");
        x.setAttribute("aria-label","Remove this tag");
        x.onclick=()=>{
          if(from==="filter") state.dropFilterTag=true; else togglePending(t);
          renderComposerTags(); $("input").focus();
        };
        c.append(x);
      }
      box.append(c);
    });
  }

  function openTagPicker(){
    openSheet(s=>{
      s.append(el("h4",null,"Tag what you’re adding"));
      const row=el("div","newtag");
      const inp=document.createElement("input");
      inp.placeholder="New tag, e.g. food"; inp.maxLength=60; inp.autocomplete="off"; inp.enterKeyHint="done";
      inp.setAttribute("aria-label","New tag");
      const addBtn=el("button","btn primary","Add");
      const addIt=()=>{
        inp.value.split(",").map(cleanTag).filter(Boolean).forEach(t=>{ if(!state.pendingTags.includes(t)) state.pendingTags.push(t); });
        inp.value=""; renderComposerTags(); draw(); inp.focus();
      };
      addBtn.onclick=addIt;
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addIt(); } });
      row.append(inp, addBtn); s.append(row);

      const grid=el("div","tagpick");
      const draw=()=>{
        grid.textContent="";
        const names=dedupe([...state.pendingTags, ...allTags().map(([t])=>t)]);
        names.forEach(t=>{
          const b=el("button","chip"); const d=el("span","dot"); d.style.background=tagColor(t);
          b.append(d, el("span",null,t));
          b.setAttribute("aria-pressed",String(state.pendingTags.includes(t)));
          b.onclick=()=>{ togglePending(t); renderComposerTags(); draw(); };
          grid.append(b);
        });
      };
      draw(); s.append(grid);
      s.append(el("div","para","Or type them: end a line with “ - food, travel”, or put #food anywhere in it."));
      s.append(item("Done",null,()=>{ closeSheet(); $("input").focus(); }));
      if(!allTags().length) requestAnimationFrame(()=>inp.focus());
    });
  }

  function renderList(){
    const list=$("list"); list.textContent="";
    const rows=visible();

    if(!rows.length){
      const n=el("div","note");
      if(state.query.trim()) n.append(el("b",null,"No match"), document.createTextNode("Nothing here contains “"+state.query.trim()+"”."));
      else if(state.today) n.append(el("b",null,"Nothing from around today"), document.createTextNode("Add dates to entries and this fills up over the years."));
      else if(state.filter||state.year) n.append(el("b",null,"Nothing in this view"), document.createTextNode("Clear the filters above to see everything."));
      else n.append(el("b",null,"Rank one is waiting"), document.createTextNode("Add the first thing you did. Try “Eating tortellini from sailors - food”."));
      list.append(n); lastNums={}; return;
    }

    let lastGroup=null; const nums={}; const clean=rankView(); let shifted=false;

    rows.forEach((r,i)=>{
      const n=r.master+1; nums[r.e.id]=n;

      if(state.sort==="tag"){
        const g=(r.e.tags||[])[0]||"untagged";
        if(g!==lastGroup){ lastGroup=g; const gr=el("div","group"); gr.append(el("span",null,g)); list.append(gr); }
      }
      if(state.editingId===r.e.id){ list.append(editRow(r.e,n)); return; }

      const row=el("div","row");
      row.dataset.master=r.master; row.dataset.num=n;
      if(!suppressFlash && lastNums[r.e.id]!=null && lastNums[r.e.id]!==n){ row.classList.add("flash"); shifted=true; }
      if(justAdded===r.e.id) row.classList.add("enter");
      if(justDropped===r.e.id) row.classList.add("jump");
      if(drag && drag.id===r.e.id) row.classList.add("lifted");
      if(clean) row.addEventListener("pointerdown", ev=>rowPointerDown(ev,r.master));
      if(state.tint && (r.e.tags||[]).length)
        row.style.backgroundImage="linear-gradient(90deg,"+tagWash(r.e.tags[0],.16)+","+tagWash(r.e.tags[0],0)+" 58%)";

      const num=el("div","num"+(clean?" handle":""));
      if(state.numEditing===r.e.id){
        const inp=document.createElement("input");
        inp.type="text"; inp.inputMode="numeric"; inp.value=String(n);
        inp.setAttribute("aria-label","Move this to rank");
        inp.addEventListener("keydown",ev=>{
          ev.stopPropagation();
          if(ev.key==="Enter"){ ev.preventDefault(); teleport(r.e.id, parseInt(inp.value,10)); }
          if(ev.key==="Escape"){ state.numEditing=null; renderList(); }
        });
        inp.addEventListener("blur",()=>{ if(state.numEditing===r.e.id) teleport(r.e.id, parseInt(inp.value,10)); });
        num.append(inp);
        requestAnimationFrame(()=>{ inp.focus(); inp.select(); });
      }else{
        num.textContent=String(n);
        num.title = clean ? "Tap to change rank · drag or hold to move" : "Tap to change rank";
        num.addEventListener("pointerdown", ev=>numPointerDown(ev,r.master,r.e.id));
      }
      row.append(num);

      const body=el("div","body");
      const text=el("button","text", r.e.text || "Empty line — tap to write it");
      if(!r.e.text) text.style.color="var(--mute)";
      text.onclick=()=>{ if(Date.now()<blockClick) return; state.numEditing=null; state.editingId=r.e.id; render(); };
      body.append(text);

      const meta=el("div","meta");
      if(state.showDates && r.e.on){
        const d=new Date(r.e.on+"T12:00:00");
        let s="◷ "+d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
        if(r.e.tm) s+=", "+r.e.tm;
        meta.append(el("span","date",s));
      }
      if(state.showTags) (r.e.tags||[]).forEach(t=>{
        const s=el("span","tag"); const d=el("span","dot"); d.style.background=tagColor(t);
        s.append(d, el("span",null,t)); meta.append(s);
      });
      if(meta.childNodes.length) body.append(meta);
      row.append(body);

      const plus=el("button","add-below","+");
      plus.title="Insert a line below";
      plus.setAttribute("aria-label","Insert a line below "+n);
      plus.onclick=()=>insertAfter(r.master);
      row.append(plus);
      list.append(row);

      if(clean && MILESTONES.includes(n)){
        const m=el("div","milestone");
        m.append(el("b",null,String(n)), el("span",null, n>=500?"and still going":"milestone"));
        list.append(m);
      }
    });

    if(shifted) buzz(6);
    suppressFlash=false; justAdded=null; justDropped=null; lastNums=nums;

    if(jumpTo!=null){
      const target=list.querySelector('.row[data-num="'+jumpTo+'"]');
      jumpTo=null;
      if(target){ target.classList.add("jump"); scrollTo(target); }
      else toast("No entry with that number", null);
    }
  }

  function editRow(entry,n){
    const row=el("div","row editing");
    row.append(el("div","num",String(n)));
    const body=el("div","body");

    const ta=el("textarea","edit-text"); ta.value=entry.text; ta.rows=1; ta.placeholder="What did you do?";
    const tagIn=el("input","edit-tags"); tagIn.value=(entry.tags||[]).join(", "); tagIn.placeholder="tags, comma separated";
    // tap a tag you already use instead of typing it
    const tagChips=el("div","edit-tagchips");
    const typedTags=()=>tagIn.value.split(",").map(cleanTag).filter(Boolean);
    const drawTagChips=()=>{
      tagChips.textContent="";
      const cur=typedTags();
      dedupe([...cur, ...allTags().slice(0,12).map(([t])=>t)]).forEach(t=>{
        const b=el("button","chip"); const d=el("span","dot"); d.style.background=tagColor(t);
        b.append(d, el("span",null,t));
        b.setAttribute("aria-pressed",String(cur.includes(t)));
        b.onclick=()=>{
          const now=typedTags();
          tagIn.value=(now.includes(t)?now.filter(x=>x!==t):[...now,t]).join(", ");
          drawTagChips();
        };
        tagChips.append(b);
      });
    };
    tagIn.addEventListener("change",drawTagChips);
    drawTagChips();
    const dateWrap=el("div","edit-date");
    const dateIn=document.createElement("input"); dateIn.type="date"; dateIn.value=entry.on||"";
    const timeIn=document.createElement("input"); timeIn.type="time"; timeIn.value=entry.tm||"";
    const clearD=el("button","btn","Clear"); clearD.style.padding="5px 10px";
    clearD.onclick=()=>{ dateIn.value=""; timeIn.value=""; };
    dateWrap.append(el("span",null,"When"), dateIn, timeIn, clearD);

    const grow=()=>{ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; };
    ta.addEventListener("input",grow);

    function harvest(){
      const p=parseEntry(ta.value);
      const typed=tagIn.value.split(",").map(cleanTag).filter(Boolean);
      entry.text=p.text; entry.tags=dedupe([...typed,...p.tags]);
      entry.on=dateIn.value||null; entry.tm=dateIn.value?(timeIn.value||null):null;
      delete entry.fresh;
    }
    function commit(){
      harvest();
      if(!entry.text){ const i=state.entries.findIndex(e=>e.id===entry.id); if(i>=0) state.entries.splice(i,1); }
      state.editingId=null; save(); render();
    }
    ta.addEventListener("keydown",e=>{
      if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); commit(); }
      if(e.key==="Escape"){ state.editingId=null; render(); }
    });
    tagIn.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); commit(); }});

    const actions=el("div","edit-actions");
    const done=el("button","btn primary","Save"); done.onclick=commit;
    const chain=el("button","btn","+ Line below");
    chain.onclick=()=>{
      harvest();
      const i=state.entries.findIndex(e=>e.id===entry.id);
      if(!entry.text&&i>=0){ state.entries.splice(i,1); state.editingId=null; save(); render(); return; }
      insertAfter(i);
    };
    const cancel=el("button","btn","Cancel");
    cancel.onclick=()=>{
      if(entry.fresh){ const i=state.entries.findIndex(e=>e.id===entry.id); if(i>=0) state.entries.splice(i,1); }
      state.editingId=null; save(); render();
    };
    const rerank=el("button","btn","Re-rank");
    rerank.title="Place it again by comparison";
    rerank.onclick=()=>{
      harvest();
      if(!entry.text){ commit(); return; }
      const i=state.entries.findIndex(x=>x.id===entry.id);
      if(i<0) return;
      pushUndo("re-ranking “"+shorten(entry.text)+"”");
      state.editingId=null;
      state.entries.splice(i,1);
      save(); render();
      if(state.entries.length) startDuel(entry, x=>finishPlacement(x,i));
      else finishPlacement(entry,0);
    };
    const del=el("button","btn danger","Delete"); del.onclick=()=>removeEntry(entry.id);
    actions.append(done,chain,rerank,cancel,del);
    body.append(ta,tagIn,tagChips,dateWrap,actions); row.append(body);
    requestAnimationFrame(()=>{ grow(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); scrollTo(row); });
    return row;
  }

  /* ---------- press, hold, drag ---------- */
  const reduced = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function beginDrag(master, node, grabY){
    if(!rankView()||drag||!node) return;
    press=null;
    const rect=node.getBoundingClientRect();
    drag={ master, id:state.entries[master].id, node, dy:0, cooldown:0, lastBuzz:0, snap:snapshot(),
           grab:(typeof grabY==="number"?grabY:rect.top+rect.height/2)-rect.top };
    node.classList.add("lifted");
    document.body.classList.add("dragging");
    const main=$("main");
    drag.prevOverflow=main.style.overflowY;
    main.style.overflowY="hidden";
    node.style.transform="scale(1.03)";
    refreshGeom();
    buzz(14);
  }
  function numPointerDown(ev,master,id){
    if(state.numEditing) return;
    const canDrag=rankView();
    if(canDrag) ev.preventDefault();
    const node=ev.currentTarget.closest(".row"), gy=ev.clientY;
    press={x:ev.clientX,y:gy,master,id,node,fromNum:true,canDrag,moved:false,
      timer: canDrag ? setTimeout(()=>beginDrag(master,node,gy),380) : null};
  }
  function rowPointerDown(ev,master){
    if(!rankView()||drag||state.numEditing) return;
    if(ev.target.closest(".add-below")||ev.target.closest(".num")||ev.target.closest("input,textarea")) return;
    const node=ev.currentTarget, gy=ev.clientY;
    press={x:ev.clientX,y:gy,master,id:state.entries[master].id,node,fromNum:false,canDrag:true,moved:false,
      timer:setTimeout(()=>beginDrag(master,node,gy),420)};
  }
  function cancelPress(){ if(press){ if(press.timer) clearTimeout(press.timer); press=null; } }

  function onPointerMove(ev){
    if(drag){ doDragMove(ev); return; }
    if(!press) return;
    if(Math.abs(ev.clientX-press.x)>8 || Math.abs(ev.clientY-press.y)>8){
      press.moved=true;
      if(press.fromNum && press.canDrag){ const m=press.master, nd=press.node, gy=press.y; cancelPress(); beginDrag(m,nd,gy); }
      else cancelPress();
    }
  }
  function onPointerUp(){
    if(drag){ endDrag(); return; }
    if(press){
      const p=press; cancelPress();
      if(p.fromNum && !p.moved){ state.numEditing=p.id; renderList(); }
    }
  }

  function syncNumbers(){
    [...$("list").querySelectorAll(".row")].forEach((r,i)=>{
      r.dataset.master=i; r.dataset.num=i+1;
      const n=r.querySelector(".num");
      if(n && !n.querySelector("input")) n.textContent=String(i+1);
    });
  }
  /* keeps the card pinned to the finger no matter how its slot or the scroll moves */
  function placeCard(clientY){
    const node=drag.node, rect=node.getBoundingClientRect();
    const slotTop=rect.top-(drag.dy||0);
    drag.dy=clientY-drag.grab-slotTop;
    node.style.transform="translateY("+drag.dy+"px) scale(1.03)";
  }

  /* row geometry in layout space — unaffected by any animation in flight */
  function refreshGeom(){
    const rows=[...$("list").querySelectorAll(".row")];
    drag.rows=rows;
    drag.geom=rows.map(r=>({el:r, top:r.offsetTop, h:r.offsetHeight}));
    drag.idx=rows.indexOf(drag.node);
    placeDropline();
  }
  function placeDropline(){
    if(!drag) return;
    let d=drag.line;
    if(!d){
      d=el("div","dropline"); d.append(document.createElement("b"));
      $("list").append(d); drag.line=d;
    }
    const g=drag.geom[drag.idx];
    if(!g) return;
    d.style.top=g.top+"px"; d.style.height=g.h+"px";
    d.querySelector("b").textContent="rank "+(drag.idx+1);
  }

  function doDragMove(ev){
    ev.preventDefault();
    const main=$("main"), box=main.getBoundingClientRect();
    if(ev.clientY<box.top+80) main.scrollTop-=16;
    else if(ev.clientY>box.bottom-80) main.scrollTop+=16;

    drag.lastY=ev.clientY;
    placeCard(ev.clientY);

    const now=Date.now();
    if(now<drag.cooldown) return;
    const g=drag.geom, idx=drag.idx;
    if(!g||idx<0||!g[idx]||!g[idx].h) return;

    // a swap only happens once the card's centre passes a neighbour's midpoint,
    // which means going back needs a full row of travel — no edge flutter
    const centre=g[idx].top+drag.dy+g[idx].h/2;
    let to=idx;
    for(let i=idx+1;i<g.length;i++){ if(centre>g[i].top+g[i].h/2) to=i; else break; }
    if(to===idx) for(let i=idx-1;i>=0;i--){ if(centre<g[i].top+g[i].h/2) to=i; else break; }
    if(to===idx) return;

    const node=drag.node, target=g[to].el;
    const marks = reduced() ? [] : drag.rows.filter(r=>r!==node).map(r=>({el:r, top:r.getBoundingClientRect().top}));

    if(to>idx) target.after(node); else target.before(node);
    const [moved]=state.entries.splice(drag.master,1);
    state.entries.splice(to,0,moved);
    drag.master=to;
    drag.cooldown=now+110;

    refreshGeom();
    placeCard(ev.clientY);

    marks.forEach(m=>{
      if(m.el._flip){ try{ m.el._flip.cancel(); }catch(e){} m.el._flip=null; }
      const d=m.top-m.el.getBoundingClientRect().top;
      if(d && m.el.animate){
        m.el._flip=m.el.animate([{transform:"translateY("+d+"px)"},{transform:"none"}],
          {duration:190, easing:"cubic-bezier(.2,.9,.3,1)"});
        m.el._flip.onfinish=()=>{ m.el._flip=null; };
      }
    });

    if(now-(drag.lastBuzz||0)>90){ buzz(4); drag.lastBuzz=now; }
    syncNumbers();
  }

  function endDrag(){
    document.body.classList.remove("dragging");
    blockClick=Date.now()+400;
    if(!drag) return;
    const node=drag.node, dy=drag.dy||0, landed=drag.id;
    if(drag.snap && drag.snap!==snapshot()) pushUndoFrom(drag.snap,"the drag");
    if(drag.line && drag.line.parentNode) drag.line.remove();
    $("main").style.overflowY=drag.prevOverflow||"";
    (drag.rows||[]).forEach(r=>{ if(r._flip){ try{ r._flip.cancel(); }catch(e){} r._flip=null; } });
    drag=null; save(); lastNums={};

    node.style.transform="";
    node.classList.add("dropping");
    let settled=false;
    const settle=()=>{
      if(settled) return; settled=true;
      node.classList.remove("lifted","dropping");
      justDropped=landed; renderList();
    };
    if(!reduced() && node.animate){
      const a=node.animate(
        [{transform:"translateY("+dy+"px) scale(1.03)"},{transform:"translateY(0) scale(1)"}],
        {duration:260, easing:"cubic-bezier(.22,1,.32,1)"});
      a.onfinish=settle;
      setTimeout(settle,420);
    }else settle();
  }
  window.addEventListener("pointermove",onPointerMove,{passive:false});
  window.addEventListener("pointerup",onPointerUp);
  window.addEventListener("pointercancel",onPointerUp);
  document.addEventListener("touchmove",ev=>{ if(drag) ev.preventDefault(); },{passive:false});
  window.addEventListener("scroll",cancelPress,true);

  /* ---------- move to a rank ---------- */
  function teleport(id, target){
    state.numEditing=null;
    const i=state.entries.findIndex(e=>e.id===id);
    if(i<0 || !Number.isFinite(target)){ renderList(); return; }
    const p=Math.max(1,Math.min(state.entries.length,Math.round(target)));
    if(p-1===i){ renderList(); return; }
    pushUndo("moving to rank "+p);
    const [moved]=state.entries.splice(i,1);
    state.entries.splice(p-1,0,moved);
    buzz(12); save(); jumpTo=p; render();
    toast("Now ranked "+p, null);
  }

  /* ---------- toast ---------- */
  function toast(msg,action){
    const t=$("toast"); $("toastMsg").textContent=msg;
    const b=$("toastAction"); b.hidden=!action;
    b.onclick=()=>{ if(action) action(); t.hidden=true; };
    t.hidden=false; clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>{t.hidden=true;},5200);
  }

  const input=$("input"), send=$("send");
  const growInput=()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,120)+"px"; };

  /* ---------- export ---------- */
  function rowsForExport(){ return visible().map(r=>({n:r.master+1,e:r.e})); }
  function asText(){ return rowsForExport().map(({n,e})=>n+". "+e.text+((e.tags||[]).length?" - "+e.tags.join(", "):"")).join("\n"); }
  function asMarkdown(){
    const head="# "+listName()+"\n\n"+state.entries.filter(e=>e.text).length+" things"+(state.filter?" · filtered by “"+state.filter+"”":"")+"\n\n";
    return head+rowsForExport().map(({n,e})=>{
      const bits=[];
      if(e.on) bits.push(new Date(e.on+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})+(e.tm?", "+e.tm:""));
      if((e.tags||[]).length) bits.push(e.tags.map(t=>"#"+t).join(" "));
      return n+". "+e.text+(bits.length?"  \n   _"+bits.join(" · ")+"_":"");
    }).join("\n");
  }
  function asCSV(){
    const esc=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';

    rowsForExport().forEach(({n,e})=>lines.push([n,esc(e.text),esc((e.tags||[]).join("; ")),esc(e.on||""),esc(e.tm||""),esc(iso(new Date(e.at)))].join(",")));

      }
    }

    const DAY=864e5, nowMs=Date.now();
    const fmtD = d => d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    function statRow(label, colour, right, cls){
      const r=el("div","srow");
      const who=el("div","who");

    const tagsAll=allTags();
    if(tagsAll.length){
      p.append(el("h3",null,"Tag mix"));
      const totalTagged=tagsAll.reduce((a,b)=>a+b[1],0);
      const mix=el("div","mix");
      tagsAll.forEach(([t,n])=>{

        i.style.width=(n/totalTagged*100)+"%"; i.style.background=tagColor(t); i.title=t+" · "+n;
        mix.append(i);
      });
      p.append(mix);
      const perEntry=(done.reduce((a,e)=>a+(e.tags||[]).length,0)/Math.max(1,done.length)).toFixed(2);
      const untag=done.filter(e=>!(e.tags||[]).length).length;
      p.append(el("div","sub", tagsAll.length+" tags · "+perEntry+" tags per entry · "+untag+" untagged"));

      const mom=tagsAll.map(([t])=>{
        const list=done.filter(e=>(e.tags||[]).includes(t));
        const recent=list.filter(e=>nowMs-when(e).getTime()<=365*DAY).length;
        const prior=list.filter(e=>{const d=nowMs-when(e).getTime(); return d>365*DAY && d<=730*DAY;}).length;
        return {t,recent,prior,delta:recent-prior};
      }).filter(x=>x.recent||x.prior).sort((a,b)=>b.delta-a.delta||b.recent-a.recent);
      if(mom.length){
        p.append(el("h3",null,"Momentum · last 12 months vs the 12 before"));
        mom.slice(0,10).forEach(m=>{
          const arrow = m.delta>0 ? "▲ +"+m.delta : m.delta<0 ? "▼ "+m.delta : "— level";
          const cls = m.delta>0 ? "up" : m.delta<0 ? "down" : "flat";
          p.append(statRow(m.t, tagColor(m.t), m.prior+" → "+m.recent+"   "+arrow, cls));

      p.append(el("h3",null,"Last seen"));
      const seen=tagsAll.map(([t])=>{

      const pc=new Map();
      done.forEach(e=>{

      p.append(el("h3",null,"Tag deep dive"));
      const chips=el("div","chiprow"), detail=el("div");
      if(!statTag || !tagsAll.some(([t])=>t===statTag)) statTag=tagsAll[0][0];

      const drawDetail=()=>{
        detail.textContent="";

        if(!list.length) return;
        detail.append(el("div","big",String(list.length)));
        detail.append(el("div","sub", Math.round(list.length/Math.max(1,done.length)*100)+"% of everything you’ve logged"));
        const first=when(list[0]), last=when(list[list.length-1]);
        if(list.length>1){
          const gap=Math.max(1,Math.round(((last-first)/DAY)/(list.length-1)));

        }else{

        const ys=[...new Set(list.map(e=>when(e).getFullYear()))].sort((a,b)=>a-b);
        const span=[]; for(let y=ys[0]; y<=ys[ys.length-1]; y++) span.push(y);
        if(span.length>1){

          const pk=Math.max.apply(null,counts);

          counts.forEach((c,i)=>{ const d=el("div"); d.style.height=Math.max(2,(c/pk)*72)+"px"; d.style.background=tagColor(statTag); d.title=span[i]+" · "+c; bars.append(d); });
          detail.append(bars);

        const partners=new Map();
        list.forEach(e=>(e.tags||[]).forEach(t=>{ if(t!==statTag) partners.set(t,(partners.get(t)||0)+1); }));
        const tp=[...partners.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
        if(tp.length){

        sm.onclick=()=>{ state.filter=statTag; state.year=null; state.today=false; closeSheet(); render(); };
        detail.append(sm);

      const drawChips=()=>{
        chips.textContent="";
        tagsAll.forEach(([t,n])=>{
          const b=el("button","chip"); const d=el("span","dot"); d.style.background=tagColor(t);
          b.append(d, el("span",null,t), el("span","n",String(n)));
          b.setAttribute("aria-pressed",String(statTag===t));
          b.onclick=()=>{ statTag=t; drawChips(); drawDetail(); };
          chips.append(b);
        });
      };
      p.append(chips, detail); drawChips(); drawDetail();
    }

    p.append(el("h3",null,"Pace · entries per month"));
    const now=new Date(), buckets=[], labels=[];
    for(let i=11;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      buckets.push({y:d.getFullYear(),m:d.getMonth(),n:0}); labels.push(MONTH[d.getMonth()]);
    }
    done.forEach(e=>{ const d=when(e); const b=buckets.find(b=>b.y===d.getFullYear()&&b.m===d.getMonth()); if(b) b.n++; });
    const peak=Math.max(1,...buckets.map(b=>b.n));
    const mrow=el("div","months");
    buckets.forEach(b=>{ const d=el("div"); d.style.height=Math.max(2,(b.n/peak)*96)+"px"; d.title=b.n+" in "+MONTH[b.m]; mrow.append(d); });
    p.append(mrow);
    const ml=el("div","mlabels"); labels.forEach(l=>ml.append(el("span",null,l))); p.append(ml);
    const t12=buckets.reduce((a,b)=>a+b.n,0);
    p.append(el("div","sub", t12+" in the last year · about "+(t12/12).toFixed(1)+" a month"));

    p.append(el("h3",null,"Adding habit · last 12 months"));
    p.append(el("div","sub","One square per day. Each column is a week, each row a weekday."));
    const byDay=new Map();
    state.entries.forEach(e=>{ const k=iso(new Date(e.at)); byDay.set(k,(byDay.get(k)||0)+1); });

    const wrap=el("div","heatwrap");
    const days=el("div","hdays");
    ["","Mon","","Wed","","Fri",""].forEach(l=>days.append(el("span",null,l)));
    wrap.append(days);

    const scroll=el("div","hscroll");
    const start=new Date(); start.setDate(start.getDate()-363); start.setDate(start.getDate()-start.getDay());
    const today=new Date();
    const months=el("div","hmonths");
    const heat=el("div","heat");
    let prevMonth=-1, inRange=0, busiest={n:0,day:null};

    for(let w=0;w<53;w++){
      const colStart=new Date(start); colStart.setDate(start.getDate()+w*7);
      const mCell=el("span");
      if(colStart.getMonth()!==prevMonth && colStart<=today){

        const b=document.createElement("b"); b.textContent=MONTH[prevMonth]; mCell.append(b);
      }

      const col=el("div","wk");
      for(let d=0;d<7;d++){
        const day=new Date(start); day.setDate(start.getDate()+w*7+d);
        const cell=el("div","d");
        if(day<=today){

          if(c>busiest.n) busiest={n:c,day:new Date(day)};

    const hmax=Math.max(1,busiest.n);
    heat.querySelectorAll(".d").forEach(c=>{

    scroll.append(months,heat); wrap.append(scroll); p.append(wrap);

    const lg=el("div","legend");

    lg.append(el("span",null,"up to "+hmax+" a day"));
    p.append(lg);
    p.append(el("div","sub", inRange+" entries added in the last 12 months"+(busiest.day?" · busiest was "+fmtD(busiest.day)+" with "+busiest.n:"")));

    const years=allYears();
    if(years.length){
      p.append(el("h3",null,"Year by year"));
      years.forEach(y=>{
        const listY=done.filter(e=>when(e).getFullYear()===y);

        card.append(yh);
        const c=new Map(); listY.forEach(e=>(e.tags||[]).forEach(t=>c.set(t,(c.get(t)||0)+1)));
        const top=[...c.entries()].sort((a,b)=>b[1]-a[1]).slice(0,4);
        if(top.length){
          const tw=el("div","yt");
          top.forEach(([t,n])=>{ const s=el("span","tag"); const d=el("span","dot"); d.style.background=tagColor(t); s.append(d, el("span",null,t+" "+n)); tw.append(s); });
          card.append(tw);

        if(pick){ const sm=el("div","sample"); sm.append(el("b",null,pick.text)); card.append(sm); }
